name: Read-only MCP tests
on:
  pull_request:
    paths:
      - 'api/**'
      - 'lib/**'
      - 'test/**'
      - 'supabase/migrations/**'
      - 'package*.json'
      - 'vercel.json'
      - '.github/workflows/mcp-tests.yml'
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
