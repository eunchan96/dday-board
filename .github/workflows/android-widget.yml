# 안드로이드 홈 화면 위젯 앱(APK)을 빌드해서 GitHub Releases의 "android-widget"에 올린다.
# 받는 주소: https://github.com/eunchan96/dday-board/releases/download/android-widget/S-DAY-widget.apk
#
# 서명: 저장소 Secrets에 WIDGET_KEYSTORE_B64 · WIDGET_KEYSTORE_PASSWORD · WIDGET_KEY_ALIAS · WIDGET_KEY_PASSWORD가 있으면
#       그 키로 (업데이트를 지우지 않고 바로 설치 가능), 없으면 빌드할 때마다 새 디버그 키 (업데이트할 때 지우고 다시 설치)
name: android-widget

on:
  push:
    branches: [main]
    paths:
      - "widgets/android/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 서명 키 준비 (있으면)
        env:
          KEYSTORE_B64: ${{ secrets.WIDGET_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WIDGET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WIDGET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WIDGET_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/widget.jks"
            {
              echo "SIGN_STORE_FILE=$RUNNER_TEMP/widget.jks"
              echo "SIGN_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGN_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGN_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: APK 빌드
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p widgets/android assembleRelease --no-daemon --stacktrace

      - name: 이름 정리
        run: cp widgets/android/app/build/outputs/apk/release/app-release.apk S-DAY-widget.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-widget
          name: S-DAY 안드로이드 위젯
          make_latest: true
          files: S-DAY-widget.apk
          body: |
            안드로이드 홈 화면 위젯 앱이에요.
            1. 아래 S-DAY-widget.apk를 내려받아 설치 (출처를 알 수 없는 앱 허용)
            2. 앱을 열어 S-DAY 설정 → 위젯에서 만든 주소를 붙여 넣고 저장
            3. 홈 화면을 길게 눌러 위젯 → S-DAY
